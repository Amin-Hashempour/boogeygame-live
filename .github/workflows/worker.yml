name: Deploy live news API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
      - name: Report public Worker URL
        run: echo "::notice title=Worker URL::${{ steps.deploy.outputs.deployment-url }}"
      - name: Smoke-test live feeds
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "${{ steps.deploy.outputs.deployment-url }}/health" | grep '"ok":true'
          for source in Z V G; do
            curl --fail --silent --show-error --retry 5 --retry-delay 2 "${{ steps.deploy.outputs.deployment-url }}/feed/$source" | grep -E -m1 '<(rss|feed)([ >])'
          done
